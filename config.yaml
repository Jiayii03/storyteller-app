# Storyteller configuration. Delete keys to use defaults.
# Model constraints verified against Google AI docs (Oct 2026):
# Video = Gemini Omni Flash (Interactions API): duration 3s-10s, 720p, audio
# always generated. Veo 3.1 Preview shut down 2026-10-22.
max_variants_per_asset: 4
max_retries: 2
confirm_above_calls: 10
max_calls_per_run: 40
request_delay_sec: 1.0
video_poll_interval_sec: 10
video_timeout_sec: 600
default_variants: 2
storyboard_columns: 3
model_constraints:
  video_allowed_durations_sec: [3, 4, 5, 6, 7, 8, 9, 10]
  video_min_duration_sec: 3
  video_supports_last_frame: true
# Rough cost estimates for the plan command (fine-grained per-model rates below).
cost_per_image_usd: 0.067
cost_per_video_sec_usd: 0.10

# Per-model rates for exact cost logging (paid tier, verified 2026-10-27).
# Update from https://ai.google.dev/gemini-api/docs/pricing when they change.
# Image models: input per 1M tokens + per-image output by resolution.
# Video models: per second (Gemini Omni Flash: audio always generated).
# Higgsfield reference-to-video catalog (verified 2026-10-27 from
# docs.higgsfield.ai model pages). image_urls is ordered: first URL is the
# first frame, the rest are identity references. Prices (list, estimates):
# see `higgsfield.pricing`; re-check https://open.higgsfield.ai/pricing.
higgsfield:
  base_url: https://api.higgsfield.ai
  models:
    seedance-2-5:
      workflow: bytedance/seedance-2.5/reference-to-video
      durations_sec: { min: 4, max: 30 }
      resolutions: ["480p", "720p", "1080p"]
      price_per_sec_usd: { "480p": 0.175 }
      params: [prompt, image_urls, duration, resolution, aspect_ratio, generate_audio]
      max_references: 30
    seedance-2-0:
      workflow: bytedance/seedance-2.0/reference-to-video
      durations_sec: { min: 4, max: 15 }
      resolutions: ["480p", "720p", "1080p", "4k"]
      price_per_sec_usd: { "480p": 0.099 }
      params: [prompt, image_urls, duration, resolution, aspect_ratio, generate_audio]
      max_references: 9
    wan-3-0:
      workflow: alibaba/wan-3.0/reference-to-video
      durations_sec: { min: 2, max: 30 }
      resolutions: ["480p", "720p", "1080p"]
      price_per_sec_usd: { "480p": 0.02, "720p": 0.050 }
      params: [prompt, image_urls, duration, resolution, aspect_ratio, generate_audio]
      max_references: 10
    wan-3-0-prime:
      workflow: alibaba/wan-3.0-prime/reference-to-video
      durations_sec: { min: 2, max: 30 }
      resolutions: ["480p", "720p", "1080p"]
      price_per_sec_usd: { "720p": 0.027 }
      params: [prompt, image_urls, duration, resolution, aspect_ratio, generate_audio]
      max_references: 10
    # UNVERIFIED: no docs page yet (404 2026-10-27); endpoint inferred from
    # the Kling URL pattern, params assumed canonical. Exists on
    # open.higgsfield.ai/pricing (Reference to Video, 3-30s, up to 1080p).
    # Test with one cheap clip before batching.
    kling-4-0:
      workflow: kling-video/v4.0/reference-to-video
      durations_sec: { min: 3, max: 30 }
      resolutions: ["480p", "720p", "1080p"]
      price_per_sec_usd: { "480p": 0.094 }
      params: [prompt, image_urls, duration, resolution, aspect_ratio, generate_audio]
      max_references: 9

